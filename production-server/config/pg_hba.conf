# ==============================================================================
# APEX INN — Hardened PostgreSQL 16 Host-Based Authentication (pg_hba.conf)
# ==============================================================================
# 1. Local container connections (healthchecks)
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# 2. Remote connections REQUIRE TLS/SSL and SCRAM-SHA-256 encrypted authentication
# Plaintext (unencrypted non-SSL) connections are strictly REJECTED at the network layer.
hostssl all             all             all                     scram-sha-256

# 3. Explicitly deny all non-SSL connections
hostnossl all           all             all                     reject
