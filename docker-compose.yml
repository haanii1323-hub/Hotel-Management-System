version: '3.8'

services:
  # 1. Your Self-Hosted PostgreSQL 16 Database
  apex-postgres:
    image: postgres:16-alpine
    container_name: apex_inn_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-apex_inn_pms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/sql:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apex_inn_pms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Automated Daily SQL Database Backup Service
  postgres-backup:
    image: postgres:16-alpine
    container_name: apex_inn_db_backup
    restart: always
    depends_on:
      apex-postgres:
        condition: service_healthy
    environment:
      PGHOST: apex-postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      PGDATABASE: ${POSTGRES_DB:-apex_inn_pms}
    volumes:
      - ./backups/sql:/backups
    entrypoint: |
      /bin/sh -c "
        while true; do
          DATE=$$(date +%Y-%m-%d_%H-%M-%S)
          echo '[BACKUP] Creating automated SQL snapshot: /backups/apex_inn_$$DATE.sql.gz'
          pg_dump -h apex-postgres -U $$PGUSER $$PGDATABASE | gzip > /backups/apex_inn_$$DATE.sql.gz
          echo '[BACKUP] Snapshot completed successfully.'
          sleep 86400
        done
      "

  # 3. APEX INN Web Application (Frontend + Backend API)
  apex-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_inn_web
    restart: always
    depends_on:
      apex-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@apex-postgres:5432/${POSTGRES_DB:-apex_inn_pms}?sslmode=disable"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-apex-inn-super-secret-key-2024-hotel-pms-production-secure}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    name: apex_inn_postgres_data
