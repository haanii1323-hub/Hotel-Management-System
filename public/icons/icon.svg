<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181d"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3540"/>
      <stop offset="100%" stop-color="#1c2026"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e53e3e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background base with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Red Center Badge -->
  <rect x="106" y="96" width="300" height="300" rx="64" fill="url(#redGrad)" filter="url(#glow)"/>

  <!-- Hotel Icon in center badge -->
  <g transform="translate(146, 136) scale(9.16)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
    <polyline points="9,22 9,12 15,12 15,22"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="448" text-anchor="middle" fill="#f0f4f8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="4">APEX INN</text>
</svg>
